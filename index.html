<head>

<style>
:root{
  --bg:#F6EFE6; --bg2:#EFE4D6; --card:#FFFDF9; --line:#E4D6C4; --grad:#F3E7D8; --hover:#E7D7C3; --waitbg:#FBE9D7; --bad:#A33; --navbg:rgba(255,253,249,.96); color-scheme:light;
  --text:#3B2A1E; --muted:#8C7765; --soft:#B9A592;
  --c7:#7A4A2A; --c7soft:#F0E1D3; --c4:#1E3557; --c4soft:#DCE4EF;
  --both:#5C4A3E; --ok:#4E7A4A; --warn:#B5651D;
  --r:18px; --shadow:0 1px 2px rgba(59,42,30,.06),0 6px 18px rgba(59,42,30,.06);
}
:root[data-theme="dark"]{
  --bg:#1C1612; --bg2:#2A211B; --card:#251D18; --line:#3A2E26; --grad:#30251D; --hover:#3A2E26; --waitbg:#4A3320; --bad:#E27B7B; --navbg:rgba(37,29,24,.96); color-scheme:dark;
  --text:#F0E6DA; --muted:#A8957F; --soft:#7A6A5A; --both:#A8957F; --ok:#6FA67C; --warn:#E0A05A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* sidebar */
.side{padding:22px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{display:flex}
.logo span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;border:2px solid var(--bg)}
.logo .d4{background:var(--c4)} .logo .d7{background:var(--c7);margin-left:-9px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;text-align:left;color:var(--muted)}
.nav button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.nav button:hover:not(.on){background:var(--bg2)}
.nav .ico{width:20px;text-align:center}
.nav small{margin-left:auto;font-size:11px;color:var(--soft)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.me .who{flex:1;min-width:0}
.me .who b{display:block}
.me .who small{color:var(--muted)}
/* main */
.main{padding:22px 28px 90px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;letter-spacing:-.3px}
.top .date{color:var(--muted)}
.top .sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;position:relative}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.btn{padding:10px 16px;border-radius:12px;background:var(--c7);color:#fff;font-weight:600}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.btn.blue{background:var(--c4)}
.suggest{background:linear-gradient(135deg,var(--card),var(--grad));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.suggest .logo span{width:26px;height:26px;font-size:13px}
.suggest b{display:block;margin-bottom:2px}
.suggest p{margin:0;color:var(--muted)}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:var(--bg2);border-radius:var(--r);padding:12px;min-height:200px;transition:background .15s}
.col.drop{background:var(--hover)}
.colhead{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700}
.colhead .n{color:var(--muted);font-weight:500}
.colhead .mins{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow);border-left:4px solid var(--both);cursor:grab;user-select:none}
.card.o7{border-left-color:var(--c7)} .card.o4{border-left-color:var(--c4)}
.card.dragging{opacity:.5}
.card .row{display:flex;gap:10px;align-items:flex-start}
.card .title{flex:1;font-weight:600;word-break:break-word}
.card.done .title{text-decoration:line-through;color:var(--muted);font-weight:500}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.chip{background:var(--bg);border-radius:8px;padding:2px 7px}
.chip.wait{background:var(--waitbg);color:var(--warn)}
.prog{height:4px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--c7)}
.marks{display:flex;margin-left:auto}
.badge{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;border:2px solid var(--card);position:relative}
.badge.b4{background:var(--c4)} .badge.b7{background:var(--c7)}
.marks .badge+.badge{margin-left:-7px}
.badge.off{opacity:.35}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--soft);display:grid;place-items:center;flex:none;color:#fff;font-size:14px;background:var(--card)}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.c7.on{background:var(--c7);border-color:var(--c7)}
.check.c4.on{background:var(--c4);border-color:var(--c4)}
.dualcheck{display:flex;gap:4px;flex:none}
.dualcheck .check{width:24px;font-weight:800;font-size:11px;color:var(--muted)}
.dualcheck .check.on{color:#fff}
.empty{color:var(--soft);text-align:center;padding:24px 8px;font-size:13px;border:1.5px dashed var(--line);border-radius:14px}
.addinline{width:100%;text-align:left;padding:10px 12px;color:var(--muted);border-radius:12px;margin-top:8px}
.addinline:hover{background:var(--hover)}
.mobtabs{display:none}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(59,42,30,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--card);border-radius:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.sheet h2{margin:0 0 14px;font-size:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
.inp:focus{border-color:var(--c7)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{padding:8px 12px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);display:flex;align-items:center;gap:6px}
.pick button.on{border-color:var(--c7);background:var(--c7soft)}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.sheet .actions .del{margin-right:auto;color:var(--bad)}
.subs{display:flex;flex-direction:column;gap:6px}
.subs .s{display:flex;gap:8px;align-items:center}
.subs .s input[type=text]{flex:1}
/* avatars */
.avgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.avopt{display:grid;place-items:center;border-radius:16px;background:var(--bg);border:2px solid transparent;padding:6px}
.avopt.on{border-color:var(--c7);background:var(--c7soft)}
.av{display:block}
.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-pick button{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.who-pick button.on{border-color:var(--c7)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.swatches button.on{box-shadow:0 0 0 2.5px var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.notes{display:flex;flex-direction:column;gap:8px}
.note{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.note small{display:block;color:var(--muted)}
.soon{background:var(--card);border-radius:var(--r);padding:28px;box-shadow:var(--shadow);max-width:560px}
.soon h2{margin-top:0}
.soon p{color:var(--muted)}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.tog{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:.15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--ok)} .tog.on::after{left:21px}
/* продукты */
.nav small.cnt{background:var(--warn);color:#fff;border-radius:9px;padding:0 7px;font-weight:600}
.fquick{display:flex;gap:8px;max-width:560px}
.fquick .inp{flex:1}
.fhint{color:var(--muted);font-size:13px;margin:10px 0}
.fgroups,.fcats{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.fstore{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.fgroups .fstore,.fcats .fstore{margin-bottom:0}
.fsh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.fsh .n{margin-left:auto;color:var(--muted);font-size:13px}
.frow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bg2)}
.frow:first-of-type{border-top:0}
.frow.out .fname{color:var(--muted)}
.fname{flex:1;min-width:0;cursor:pointer}
.fname small{display:block;color:var(--muted);font-size:12px}
.fname .chip{display:inline-block;margin-top:4px;font-size:12px}
.fav{color:#C9A227;font-size:12px}
.fprice{color:var(--muted);font-size:13px;white-space:nowrap}
.fbtn{padding:7px 11px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;white-space:nowrap}
.fbtn:hover{border-color:var(--warn);color:var(--warn)}
.fbtn.back{background:var(--c7soft);border-color:var(--c7);color:var(--c7)}
.flinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.flinks .btn{padding:8px 12px;font-size:13px;text-decoration:none}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:22px}
.mrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.ml{width:70px;color:var(--muted);font-size:13px}
.mbar{flex:1;height:14px;background:var(--bg2);border-radius:7px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mv{width:80px;text-align:right;font-weight:600;font-size:14px}
.msub{margin-left:80px;font-size:12px;color:var(--muted)}
.lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 3px 0 8px}
@media (max-width:820px){.fstats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat b{font-size:17px}.fgroups,.fcats{grid-template-columns:1fr}.msub{margin-left:0}.ml{width:58px}}
/* деньги */
.mhero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--card),var(--grad));border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.mhero>div{flex:1}.mhero small{display:block;color:var(--muted)}.mhero b{font-size:34px;letter-spacing:-.5px;display:block;line-height:1.15}.mhero span{color:var(--muted);font-size:13px}
.mhero.over b{color:var(--bad)}
.mbar.big{height:18px}
.mdot{width:10px;height:10px;border-radius:50%;flex:none}
/* настройки, валюта, деньги v2 */
.syncpill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--muted)}
.syncpill.ok{color:var(--ok)}.syncpill.error,.syncpill.auth{color:var(--bad)}.syncpill.sync{color:var(--warn)}
.presets{margin-bottom:10px}.presets small{color:var(--muted)}
.prow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pre{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;border:2px solid transparent;width:84px}
.pre.on{border-color:var(--c7)}
.pre .sw{display:flex;align-items:center;justify-content:center;gap:3px;width:100%;height:34px;border-radius:9px;border:1px solid var(--line)}
.pre .sw i{width:12px;height:12px;border-radius:50%;display:block}
.pre em{font-style:normal;font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.card.ro{opacity:.82}
.card.ro .title{cursor:pointer}
.check:disabled{cursor:not-allowed;opacity:.55}
.sheet.wide{max-width:820px}
.sets{display:grid;grid-template-columns:150px 1fr;gap:18px;min-height:380px}
.setnav{display:flex;flex-direction:column;gap:2px}
.setnav button{padding:9px 12px;border-radius:10px;text-align:left;color:var(--muted)}
.setnav button.on{background:var(--bg2);color:var(--text);font-weight:600}
.setbody{min-width:0;max-height:62vh;overflow:auto;padding-right:4px}
.setbody h3{margin:18px 0 6px;font-size:15px}.setbody h3:first-child{margin-top:0}
.amt{display:flex;gap:6px;min-width:0}.amt .inp{flex:1;min-width:0}
select.cur{width:auto;padding:0 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:13px}
select.inp{appearance:auto}
.rhist{display:flex;flex-direction:column;margin-top:8px}.rhist small{color:var(--muted)}
.lims{display:flex;flex-direction:column;gap:6px}
.lim{display:grid;grid-template-columns:1fr 64px 14px 90px;gap:6px;align-items:center}
.lim .inp{padding:7px 8px;text-align:right}.lim small{color:var(--muted);text-align:right}
.limtot{margin-top:8px;font-size:13px;color:var(--ok)}.limtot.bad{color:var(--bad)}
.mebtn{display:flex;gap:10px;align-items:center;flex:1;min-width:0;text-align:left;border-radius:12px}
.mebtn .who{display:block;min-width:0}.mebtn .who b,.mebtn .who small{display:block}.mebtn .who small{color:var(--muted)}
.mgear{display:none}
.mgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:14px;min-width:0}.mcol .fstore{margin-bottom:0}
.mjournal{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
.jchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.jchips button{white-space:nowrap;padding:5px 11px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:13px}
.jchips button.on{background:var(--c7soft);border-color:var(--c7)}
.jh{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:2px 0 6px}
.jh button{font-size:13px;color:var(--muted);padding:4px 8px;border-radius:8px}.jh button.on{color:var(--text);background:var(--bg2);font-weight:600}
.jrow.link{cursor:pointer}.jrow.link:hover{background:var(--bg)}
.jdel{width:24px;height:24px;border-radius:8px;box-shadow:none;font-size:12px;background:none;color:var(--soft)}
.lrow{margin-bottom:10px}.lt{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:4px}
.lt .lv{margin-left:auto;font-size:13px;color:var(--muted)}.lt .lv.bad{color:var(--bad);font-weight:600}
.linkbtn{margin-left:auto;color:var(--c7);font-size:13px;font-weight:600}
@media (max-width:820px){
  .sets{grid-template-columns:1fr}.setnav{flex-direction:row;overflow-x:auto}.setnav button{white-space:nowrap}
  .mgear{display:grid}.mgrid{grid-template-columns:1fr}.mjournal{position:static;max-height:none}
}
/* mobile */
.bottomnav{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
  .top{flex-wrap:nowrap;gap:8px}
  .top h1{font-size:21px}
  .board{grid-template-columns:1fr}
  .board .col{display:none} .board .col.mshow{display:block}
  .mobtabs{display:flex;margin-bottom:12px}
  .mobtabs .seg{width:100%} .mobtabs .seg button{flex:1;padding:8px 4px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
  .bottomnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);gap:2px;padding:4px 0}
  .bottomnav button.on{color:var(--c7);font-weight:600}
  .bottomnav .ico{font-size:19px}
  .fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--c7);color:#fff;font-size:28px;box-shadow:0 8px 20px rgba(122,74,42,.35);z-index:41;display:grid;place-items:center}
  .top .addbtn{display:none}
  .card{cursor:default}
}
@media (min-width:821px){.fab{display:none}}
</style>

<script>
/* ===== Помощник 47 — локальная версия (данные в localStorage) ===== */
const KEY = 'p47.v1';
const COLS = [['today','Сегодня'],['week','На этой неделе'],['done','Готово']];
const SECTIONS = [
  ['tasks','✓','Задачи'],['places','📍','Места'],['food','🛒','Продукты'],
  ['money','₾','Деньги'],['meals','🍲','Еда'],['study','🇬🇧','Учёба'],['books','📖','Книги']
];
const SOON = {
  places:['Места','Карта Ваке и Тбилиси: отмечаем кофейни и интересные места, собираем прогулку с примерным временем, и она сразу становится общей задачей на доске.'],
  food:['Продукты','Кнопка «закончилось», запасы и частые продукты. Список «докупить» группируется по магазинам, рядом ссылка на магазин в Wolt. Заказываете вы сами, приложение ничего не покупает.'],
  money:['Деньги','Бюджет на месяц и сумма, которую можно тратить в день до конца месяца. Траты на еду считаются отдельно.'],
  meals:['Еда','Меню на неделю для правильного питания, из него собирается список продуктов.'],
  study:['Учёба','Уроки английского и другие курсы как задачи с прогрессом для каждого.'],
  books:['Книги','Что читаем на Boox, прогресс и «хочу прочитать».']
};

/* ---------- avatars ---------- */
const SKIN = ['#F6D7BD','#E9B98F','#C98E62','#8D5A3B'];
const HAIRC = ['#2B1D14','#5A3820','#9B6A3C','#D9B06A','#7A2E1F'];
const HAIRS = ['short','long','bun','curly','side','none'];
const ACC = ['none','glasses','beard','cap','phones','flower'];
const ACC_NAMES = {none:'Без',glasses:'Очки',beard:'Борода',cap:'Кепка',phones:'Наушники',flower:'Цветок'};
const HAIR_NAMES = {short:'Короткие',long:'Длинные',bun:'Пучок',curly:'Кудри',side:'Чёлка',none:'Без волос'};
const PRESETS = {
  '7':[{skin:0,hair:'short',hc:1,acc:'none'},{skin:1,hair:'side',hc:0,acc:'glasses'},{skin:0,hair:'short',hc:0,acc:'beard'},
       {skin:1,hair:'curly',hc:1,acc:'phones'},{skin:2,hair:'none',hc:0,acc:'cap'},{skin:0,hair:'side',hc:3,acc:'none'}],
  '4':[{skin:0,hair:'long',hc:1,acc:'none'},{skin:0,hair:'bun',hc:0,acc:'glasses'},{skin:1,hair:'long',hc:3,acc:'flower'},
       {skin:0,hair:'curly',hc:4,acc:'none'},{skin:2,hair:'bun',hc:1,acc:'phones'},{skin:0,hair:'side',hc:2,acc:'flower'}]
};
function avatarSVG(a, who, size=48, badge=true){
  const shirt = colorOf(who);
  const bg = softOf(who);
  const s = SKIN[a.skin]||SKIN[0], h = HAIRC[a.hc]||HAIRC[0];
  let back='', front='', acc='';
  switch(a.hair){
    case 'short': front=`<path d="M28 44 Q27 19 50 18 Q73 19 72 44 Q68 31 50 30 Q33 31 28 44Z" fill="${h}"/>`;break;
    case 'long': back=`<path d="M25 46 Q24 15 50 15 Q76 15 75 46 L78 82 Q64 78 62 64 L38 64 Q36 78 22 82Z" fill="${h}"/>`;
      front=`<path d="M28 42 Q31 21 50 21 Q69 21 72 42 Q62 30 50 33 Q40 29 28 42Z" fill="${h}"/>`;break;
    case 'bun': back=`<circle cx="50" cy="14" r="10" fill="${h}"/>`;
      front=`<path d="M28 43 Q29 20 50 20 Q71 20 72 43 Q66 30 50 30 Q34 30 28 43Z" fill="${h}"/>`;break;
    case 'curly': front=[[31,34],[38,25],[48,21],[58,22],[67,28],[71,37],[29,42],[60,30],[42,30]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="${h}"/>`).join('');break;
    case 'side': front=`<path d="M27 46 Q25 18 52 18 Q74 19 73 44 Q70 32 60 30 Q46 40 30 38Z" fill="${h}"/>`;break;
  }
  switch(a.acc){
    case 'glasses': acc=`<g fill="none" stroke="#3B2A1E" stroke-width="2"><circle cx="42" cy="47" r="6"/><circle cx="58" cy="47" r="6"/><path d="M48 47h4"/></g>`;break;
    case 'beard': acc=`<path d="M30 50 Q31 72 50 73 Q69 72 70 50 Q66 62 57 60 Q50 57 43 60 Q34 62 30 50Z" fill="${h}"/><path d="M44 59 Q50 63 56 59" stroke="#3B2A1E" stroke-width="2" fill="none" stroke-linecap="round"/>`;break;
    case 'cap': acc=`<path d="M27 38 Q28 17 50 17 Q72 17 73 38Z" fill="${shirt}"/><path d="M50 36 L84 38 Q80 43 70 41Z" fill="${shirt}"/><circle cx="50" cy="18" r="2.5" fill="#fff" opacity=".6"/>`;break;
    case 'phones': acc=`<path d="M26 46 Q26 14 50 14 Q74 14 74 46" fill="none" stroke="#3B2A1E" stroke-width="3"/><rect x="21" y="42" width="9" height="14" rx="4" fill="#3B2A1E"/><rect x="70" y="42" width="9" height="14" rx="4" fill="#3B2A1E"/>`;break;
    case 'flower': acc=`<g transform="translate(69 27)">${[0,72,144,216,288].map(r=>`<ellipse rx="3.5" ry="6" cy="-5" fill="#E8A0A8" transform="rotate(${r})"/>`).join('')}<circle r="3" fill="#F2C14E"/></g>`;break;
  }
  const mouth = a.acc==='beard' ? '' : `<path d="M44 57 Q50 62 56 57" stroke="#3B2A1E" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const b = badge ? `<circle cx="80" cy="80" r="15" fill="${shirt}" style="stroke:var(--card)" stroke-width="3"/><text x="80" y="86" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" font-family="-apple-system,Segoe UI,sans-serif">${who}</text>` : '';
  return `<svg class="av" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
    <defs><clipPath id="cl${who}${size}"><circle cx="50" cy="50" r="48"/></clipPath></defs>
    <circle cx="50" cy="50" r="48" fill="${bg}"/>
    <g clip-path="url(#cl${who}${size})">${back}
      <path d="M18 104 Q20 74 50 72 Q80 74 82 104Z" fill="${shirt}"/>
      <rect x="44" y="60" width="12" height="14" rx="5" fill="${s}"/>
      <circle cx="50" cy="46" r="22" fill="${s}"/>
      <circle cx="42" cy="47" r="2.4" fill="#3B2A1E"/><circle cx="58" cy="47" r="2.4" fill="#3B2A1E"/>
      <circle cx="37" cy="54" r="3.2" fill="#E8A0A8" opacity=".55"/><circle cx="63" cy="54" r="3.2" fill="#E8A0A8" opacity=".55"/>
      ${mouth}${front}${acc}</g>${b}</svg>`;
}
const logo = () => `<span class="logo"><span class="d4">4</span><span class="d7">7</span></span>`;
const badgeEl = (w, off) => `<span class="badge b${w}${off?' off':''}">${w}</span>`;

/* ---------- state ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => new Date().toISOString().slice(0,10);
const NAMES = typeof PRIV_NAMES!=='undefined' ? PRIV_NAMES : {'7':'','4':''};
function seed(){
  const demo = typeof PRIV_TASKS!=='undefined' ? PRIV_TASKS : [['Добавьте первую задачу','both','today',15]];
  return {
    version:1, me:null, setupDone:false,
    people:{'7':{name:NAMES['7'],avatar:{...PRESETS['7'][0]}},'4':{name:NAMES['4'],avatar:{...PRESETS['4'][0]}}},
    settings:{notify:{'7':true,'4':true,shared:true}},
    notes:[],
    tasks: demo.map(d=>t(...d))
  };
  function t(title,owner,col,minutes,sub=[]){return {id:uid(),title,owner,col,minutes,date:'',note:'',sub,checks:{'7':false,'4':false},createdAt:Date.now()}}
}
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || seed(); }catch(e){ S = seed(); }
['7','4'].forEach(w=>{ if(!S.people[w].name && NAMES[w]) S.people[w].name = NAMES[w]; });
const saveLocal = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const save = () => { saveLocal(); if(typeof syncSoon==='function') syncSoon(); };
let UI = { section:'tasks', filter:'all', mcol:'today', modal:null };

const other = w => w==='7' ? '4' : '7';
const pname = w => S.people[w].name || (w==='7' ? 'Он' : 'Она');
const herLabel = () => S.me==='4' ? 'Его' : 'Её';

/* ---------- notifications (in-app) ---------- */
function notify(text, scope){ // scope: '7' | '4' | 'shared'
  const on = S.settings.notify[scope];
  if(!on) return;
  S.notes.unshift({id:uid(), text, scope, at:Date.now(), read:false});
  S.notes = S.notes.slice(0,50);
}
let toastTimer;
function toast(msg){
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.remove(),2400);
}

/* ---------- task logic ---------- */
function visible(task){
  const f = UI.filter;
  if(f==='all') return true;
  if(f==='7' || f==='4') return task.owner===f;
  if(f==='both') return task.owner==='both';
}
const canEdit = t => t.owner==='both' || t.owner===S.me;
const fem = w => w==='4';
function toggleCheck(id, who){
  const task = S.tasks.find(x=>x.id===id); if(!task || !canEdit(task)) return;
  if(task.owner==='both' && who!==S.me){ toast('Свою отметку ставит каждый сам'); return; }
  if(task.owner==='both'){
    task.checks[who] = !task.checks[who];
    if(task.checks['7'] && task.checks['4']){ task.prevCol = task.col==='done'?task.prevCol:task.col; task.col='done'; task.doneAt=Date.now(); toast('Готово вдвоём 🎉'); notify(`«${task.title}» закрыта вдвоём`,'shared'); }
    else {
      if(task.col==='done'){ task.col = task.prevCol||'today'; }
      if(task.checks[who]){ toast(`${pname(who)} отметил${who==='4'?'а':''}. Ждём ${pname(other(who))}`); notify(`${pname(who)} отметил${who==='4'?'а':''} «${task.title}», ждём твою отметку`, other(who)); }
    }
  } else {
    if(task.col==='done'){ task.col = task.prevCol||'today'; task.checks[task.owner]=false; }
    else { task.prevCol=task.col; task.col='done'; task.checks[task.owner]=true; task.doneAt=Date.now(); toast('Готово ✓'); }
  }
  save(); render();
}
function moveTask(id, col, confirmed){
  const task = S.tasks.find(x=>x.id===id); if(!task || task.col===col) return;
  if(!canEdit(task)){ toast(`Это задача: ${pname(task.owner)}. Двигать её может только владелец`); return; }
  if(col==='done' && task.owner==='both' && !task.checks[S.me] && !task.checks[other(S.me)] && !confirmed){ askDone(id, col); return; }
  if(col==='done'){
    if(task.owner==='both'){ task.checks[S.me]=true; if(!(task.checks['7']&&task.checks['4'])){ toast(`Общая задача: ждём отметку ${other(S.me)}`); notify(`${pname(S.me)} отметил${S.me==='4'?'а':''} «${task.title}», ждём твою отметку`, other(S.me)); save(); render(); return; } }
    else task.checks[task.owner]=true;
    task.prevCol=task.col; task.doneAt=Date.now();
  } else if(task.col==='done'){ task.checks={'7':false,'4':false}; }
  task.col=col; save(); render();
}
function askDone(id, col){ UI.modal = {type:'confirm', id, col}; render(); }
function confirmView(m){
  const t = S.tasks.find(x=>x.id===m.id); if(!t) return '';
  const w = other(S.me), f = fem(w);   // спрашиваем про партнёра
  return `<div class="scrim" data-close><div class="sheet" style="max-width:380px"><h2>${esc(pname(w))} ${f?'согласна':'согласен'} и ${f?'сделала':'сделал'} задачу?</h2>
    <p style="color:var(--muted);margin:0">«${esc(t.title)}»</p>
    <p class="fhint">«Да»: задача закроется для обоих. «Ещё нет»: ваша отметка встанет, и мы ждём ${esc(pname(w))}.</p>
    <div class="actions"><button class="btn ghost" id="cf-no">Ещё нет</button><button class="btn" id="cf-yes">Да, ${f?'сделала':'сделал'}</button></div></div></div>`;
}
const fmtMin = m => !m ? '' : m<60 ? `${m} мин` : `${Math.floor(m/60)} ч${m%60?' '+m%60+' мин':''}`;

/* ---------- render ---------- */
const $root = document.getElementById('root');
function render(){
  applyLook();
  if(!S.setupDone || !S.me || (typeof SYNC!=='undefined' && SYNC.on && !syncHasSession())){ $root.innerHTML = setupView(); bindSetup(); return; }
  const unread = S.notes.filter(n=>!n.read && (n.scope===S.me || n.scope==='shared')).length;
  const sec = SECTIONS.find(s=>s[0]===UI.section);
  $root.innerHTML = `
  <div class="app">
    <aside class="side">
      <div class="brand">${logo()} Помощник 47</div>
      <nav class="nav">${SECTIONS.map(([k,i,n])=>`<button data-sec="${k}" class="${UI.section===k?'on':''}"><span class="ico">${i}</span>${n}${k==='food'&&S.food&&foodOutCount()?`<small class="cnt">${foodOutCount()}</small>`:k!=='tasks'&&k!=='food'&&k!=='money'?'<small>скоро</small>':''}</button>`).join('')}</nav>
      <div class="me"><button class="mebtn" data-act="profile" title="Настроить персонажа">${avatarSVG(S.people[S.me].avatar,S.me,40)}<span class="who"><b>${esc(pname(S.me))}</b><small>мой персонаж</small></span></button>
        <button class="iconbtn" data-act="settings" title="Общие настройки">⚙︎</button></div>
    </aside>
    <main class="main">
      <div class="top">
        <div><h1>${UI.section==='tasks' ? greet() : sec[2]}</h1><div class="date">${dateStr()}</div></div>
        <div class="sp"></div>
        <span id="syncpill" class="syncpill" style="display:none"></span>
        <button class="iconbtn mgear" data-act="settings" title="Настройки">⚙︎</button>
        <button class="iconbtn" data-act="notes" title="Уведомления">🔔${unread?'<span class="dot"></span>':''}</button>
        <button class="iconbtn" data-act="profile" title="Профиль" style="padding:0;overflow:hidden">${avatarSVG(S.people[S.me].avatar,S.me,40,false)}</button>
        ${UI.section==='tasks'?'<button class="btn addbtn" data-act="add">+ Задача</button>':''}
      </div>
      ${UI.section==='tasks' ? tasksView() : UI.section==='food' ? foodView() : UI.section==='money' ? moneyView() : soonView(UI.section)}
    </main>
  </div>
  <nav class="bottomnav">${SECTIONS.map(([k,i,n])=>`<button data-sec="${k}" class="${UI.section===k?'on':''}"><span class="ico">${i}</span>${n}</button>`).join('')}</nav>
  ${UI.section==='tasks'?'<button class="fab" data-act="add" aria-label="Добавить задачу">+</button>':''}
  ${UI.modal ? modalView() : ''}`;
  bind();
  if(typeof paintSync==='function') paintSync();
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function greet(){ const h=new Date().getHours(); return (h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер')+', '+esc(pname(S.me)); }
function dateStr(){ return new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}); }

function suggestion(){
  const today = S.tasks.filter(t=>t.col==='today');
  const mins = today.reduce((a,t)=>a+(+t.minutes||0),0);
  const waitMe = S.tasks.filter(t=>t.owner==='both' && t.col!=='done' && t.checks[other(S.me)] && !t.checks[S.me]);
  const walk = today.find(t=>t.owner==='both' && /прогул|кофе/i.test(t.title));
  const parts = [];
  parts.push(today.length ? `На сегодня ${today.length} ${plural(today.length,'задача','задачи','задач')}, примерно ${fmtMin(mins)||'без оценки времени'}.` : 'На сегодня задач нет. Можно перенести что-то из недели.');
  if(waitMe.length) parts.push(`${waitMe.length} ${plural(waitMe.length,'общая задача ждёт','общие задачи ждут','общих задач ждут')} твоей отметки.`);
  if(walk) parts.push('Прогулку лучше поставить после дел, пока светло.');
  if(mins>360) parts.push('Это больше 6 часов: часть стоит перенести на неделю.');
  return parts.join(' ');
}
function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }

function tasksView(){
  const F = [['all','Все'],['7',pname('7')],['4',pname('4')],['both','Вместе']];
  return `
  <div class="suggest">${logo()}<div><b>47 предлагает</b><p>${suggestion()}</p></div></div>
  <div class="filters"><div class="seg">${F.map(([k,n])=>`<button data-filter="${k}" class="${UI.filter===k?'on':''}">${n}</button>`).join('')}</div></div>
  <div class="mobtabs"><div class="seg">${COLS.map(([k,n])=>{const c=S.tasks.filter(t=>t.col===k&&visible(t)).length;return `<button data-mcol="${k}" class="${UI.mcol===k?'on':''}">${k==='week'?'Неделя':n} ${c?'· '+c:''}</button>`}).join('')}</div></div>
  <div class="board">${COLS.map(([k,n])=>{
    let list = S.tasks.filter(t=>t.col===k && visible(t));
    if(k==='done' && S.settings.tasks.doneDays){ const lim=Date.now()-S.settings.tasks.doneDays*864e5; list=list.filter(t=>(t.doneAt||0)>=lim); }
    if(k==='done') list.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
    const mins = list.reduce((a,t)=>a+(+t.minutes||0),0);
    return `<section class="col ${UI.mcol===k?'mshow':''}" data-col="${k}">
      <div class="colhead">${n} <span class="n">${list.length}</span>${k!=='done'&&mins?`<span class="mins">≈ ${fmtMin(mins)}</span>`:''}</div>
      <div class="cards">${list.length?list.map(cardView).join(''):`<div class="empty">${k==='done'?'Здесь появятся сделанные задачи':'Пусто. Перетащите сюда задачу или добавьте новую'}</div>`}</div>
      ${k!=='done'?`<button class="addinline" data-act="add" data-col="${k}">+ Добавить</button>`:''}
    </section>`;}).join('')}</div>`;
}
function cardView(t){
  const done = t.col==='done';
  const subDone = t.sub.filter(s=>s.d).length;
  let checkEl;
  if(t.owner==='both'){
    checkEl = `<span class="dualcheck">${['7','4'].map(w=>`<button class="check c${w} ${t.checks[w]?'on':''}" data-check="${t.id}" data-who="${w}" title="Отметка: ${esc(pname(w))}" ${w!==S.me?'disabled':''}>${w}</button>`).join('')}</span>`;
  } else checkEl = `<button class="check c${t.owner} ${done?'on':''}" data-check="${t.id}" data-who="${t.owner}" aria-label="Выполнено" ${canEdit(t)?'':'disabled'}>${done?'✓':''}</button>`;
  const waiting = t.owner==='both' && !done && (t.checks['7']!==t.checks['4']);
  const marks = t.owner==='both' ? badgeEl('4')+badgeEl('7') : badgeEl(t.owner);
  return `<article class="card o${t.owner==='both'?'b':t.owner} ${done?'done':''} ${canEdit(t)?'':'ro'}" draggable="${canEdit(t)?'true':'false'}" data-id="${t.id}">
    <div class="row">${checkEl}<div class="title" data-open="${t.id}">${esc(t.title)}</div></div>
    <div class="meta">
      ${t.minutes?`<span class="chip">⏱ ${fmtMin(+t.minutes)}</span>`:''}
      ${t.date?`<span class="chip">📅 ${new Date(t.date).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</span>`:''}
      ${t.sub.length?`<span class="chip">${subDone}/${t.sub.length}</span>`:''}
      ${waiting?`<span class="chip wait">ждём ${t.checks['7']?'4':'7'}</span>`:''}
      <span class="marks">${marks}</span>
    </div>
    ${t.sub.length?`<div class="prog"><i style="width:${Math.round(subDone/t.sub.length*100)}%"></i></div>`:''}
  </article>`;
}
function soonView(k){
  const [title, text] = SOON[k];
  return `<div class="soon"><h2>${title}</h2><p>${text}</p><p>Этот раздел в следующих шагах. Сейчас готовы дизайн, аватары и доска задач.</p></div>`;
}

  if(m.type==='order') return orderModal2(m);

    <div class="field"><label>Когда</label><div class="pick" id="f-col">${COLS.map(([k,n])=>`<button data-v="${k}" class="${t.col===k?'on':''}">${n}</button>`).join('')}</div></div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1"><label>Время, мин</label><input class="inp" id="f-min" type="number" min="0" step="5" value="${t.minutes||''}" placeholder="30"></div>
      <div style="flex:1"><label>Дата</label><input class="inp" id="f-date" type="date" value="${t.date||''}"></div>
    </div>
    <div class="field"><label>Пункты (необязательно)</label><div class="subs" id="f-subs">
      ${t.sub.map((s,i)=>`<div class="s"><button class="check ${s.d?'on':''}" data-sub="${i}">${s.d?'✓':''}</button><input type="text" class="inp" data-subt="${i}" value="${esc(s.t)}"><button data-subdel="${i}" title="Убрать">✕</button></div>`).join('')}
      <button class="addinline" id="f-subadd" style="margin:0">+ пункт</button></div></div>
    <div class="field"><label>Заметка</label><textarea class="inp" id="f-note" rows="2">${esc(t.note)}</textarea></div>
    <div class="actions">${ro?'<button class="btn" data-close>Закрыть</button>':`${m.isNew?'':'<button class="del" id="f-del">Удалить</button>'}
      <button class="btn ghost" data-close>Отмена</button><button class="btn" id="f-save">Сохранить</button>`}</div>
  </div></div>`;
}
function profileModal(m){
  const w = m.who, a = m.av;
  return `<div class="scrim" data-close><div class="sheet">
    <h2>Мой персонаж</h2>
    <div class="field"><label>Кто пользуется этим устройством</label><div class="who-pick">
      ${['7','4'].map(x=>`<button data-me="${x}" class="${S.me===x?'on':''}">${avatarSVG(S.people[x].avatar,x,56)}<b>${esc(pname(x))}</b></button>`).join('')}</div></div>
    <div class="field"><label>Редактирую персонажа</label><div class="seg">${['7','4'].map(x=>`<button data-edit="${x}" class="${w===x?'on':''}">${x} · ${esc(pname(x))}</button>`).join('')}</div></div>
    <div style="display:flex;justify-content:center;margin:6px 0 12px">${avatarSVG(a,w,110)}</div>
    <div class="field"><label>Имя</label><input class="inp" id="p-name" value="${esc(m.name)}" placeholder="Имя"></div>
    ${avatarEditor(a,w)}
    <div class="actions"><button class="del" id="p-logout">Выйти</button><button class="btn ghost" data-close>Закрыть</button><button class="btn" id="p-save">Сохранить</button></div>
  </div></div>`;
}
function avatarEditor(a,w){
  return `
    <div class="field"><label>Готовые образы</label><div class="avgrid">${PRESETS[w].map((p,i)=>`<button class="avopt ${same(p,a)?'on':''}" data-preset="${i}">${avatarSVG(p,w,64,false)}</button>`).join('')}</div></div>
    <div class="field"><label>Кожа</label><div class="swatches">${SKIN.map((c,i)=>`<button style="background:${c}" class="${a.skin===i?'on':''}" data-skin="${i}"></button>`).join('')}</div></div>
    <div class="field"><label>Волосы</label><div class="pick">${HAIRS.map(h=>`<button data-hair="${h}" class="${a.hair===h?'on':''}">${HAIR_NAMES[h]}</button>`).join('')}</div>
      <div class="swatches" style="margin-top:8px">${HAIRC.map((c,i)=>`<button style="background:${c}" class="${a.hc===i?'on':''}" data-hc="${i}"></button>`).join('')}</div></div>
    <div class="field"><label>Деталь</label><div class="pick">${ACC.map(x=>`<button data-acc="${x}" class="${a.acc===x?'on':''}">${ACC_NAMES[x]}</button>`).join('')}</div></div>
    <div class="field"><label>Цвет кружка с цифрой (${effTheme()==='dark'?'тёмная':'светлая'} тема)</label><div class="swatches">${PCOLS.map(([n,l,d],i)=>`<button title="${n}" style="background:${effTheme()==='dark'?d:l}" class="${(S.settings.pcolor[effTheme()][w]??(w==='7'?0:1))===i?'on':''}" data-pc="${i}"></button>`).join('')}</div></div>`;
}
const same = (p,a) => p.skin===a.skin && p.hair===a.hair && p.hc===a.hc && p.acc===a.acc;
function notesModal(){
  const list = S.notes.filter(n=>n.scope===S.me||n.scope==='shared');
  return `<div class="scrim" data-close><div class="sheet"><h2>Уведомления</h2>
    <div class="notes">${list.length?list.map(n=>`<div class="note">${esc(n.text)}<small>${n.scope==='shared'?'общее':'для '+n.scope} · ${new Date(n.at).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div>`).join(''):'<div class="empty">Пока ничего</div>'}</div>
    <div class="actions"><button class="btn" data-close>Понятно</button></div></div></div>`;
}

/* ---------- setup (first run) ---------- */
let SET = { step:0, who:null, av:{'7':{...PRESETS['7'][0]},'4':{...PRESETS['4'][0]}}, name:{'7':NAMES['7'],'4':NAMES['4']} };
function setupView(){
  const first = !S.setupDone;
  if(SET.step===0){
    const btn = w => { const nm = first ? SET.name[w] : pname(w), av = first ? SET.av[w] : S.people[w].avatar;
      return `<button data-login="${w}">${avatarSVG(av,w,72)}<b>Войти как ${esc(nm||('«'+w+'»'))}</b></button>`; };
    return `<div class="scrim" style="background:var(--bg)"><div class="sheet" style="text-align:center;max-width:440px">
      <div style="display:flex;justify-content:center;margin:8px 0 12px">${logo()}</div>
      <h2 style="font-size:24px">Помощник 47</h2>
      <p style="color:var(--muted)">${first?'Задачи, прогулки, продукты и бюджет для двоих. Выберите, кто вы. Персонажа можно настроить сразу после входа.':'Выберите, кто вы.'}</p>
      <div class="who-pick">${btn('7')}${btn('4')}</div></div></div>`;
  }
  if(SET.step===3){
    const w = SET.who, nm = first ? (SET.name[w]||('«'+w+'»')) : pname(w);
    return `<div class="scrim" style="background:var(--bg)"><div class="sheet" style="max-width:380px">
      <div style="display:flex;justify-content:center;margin:0 0 10px">${avatarSVG(first?SET.av[w]:S.people[w].avatar,w,84)}</div>
      <h2 style="text-align:center">Вход: ${esc(nm)}</h2>
      <form id="s-form" autocomplete="on" onsubmit="return false">
      <input type="email" name="username" autocomplete="username" value="${SYNC_EMAIL(w)}" readonly tabindex="-1" aria-hidden="true" style="position:absolute;opacity:0;height:0;width:0;border:0;padding:0;pointer-events:none">
      <div class="field"><label>Пароль</label><input class="inp" id="s-pw" name="password" type="password" autocomplete="current-password" autofocus></div>
      <label class="fhint" style="display:flex;gap:8px;align-items:center;margin:0 0 6px"><input type="checkbox" id="s-rem" checked> Запомнить это устройство</label>
      <p class="fhint" id="s-err" style="color:var(--bad);min-height:18px;margin:0"></p>
      <div class="actions"><button type="button" class="btn ghost" id="s-back">Назад</button><button type="submit" class="btn ${w==='4'?'blue':''}" id="s-go">Войти</button></div></form></div></div>`;
  }
  const w = SET.who, a = SET.av[w];
  return `<div class="scrim" style="background:var(--bg)"><div class="sheet">
    <h2>Ваш персонаж: ${w}</h2>
    <div style="display:flex;justify-content:center;margin:0 0 12px">${avatarSVG(a,w,110)}</div>
    <div class="field"><label>Имя</label><input class="inp" id="s-name" value="${esc(SET.name[w])}" placeholder="Имя"></div>
    ${avatarEditor(a,w)}
    <div class="actions"><button class="btn ghost" id="s-back">Назад</button><button class="btn ${w==='4'?'blue':''}" id="s-next">Войти</button></div>
  </div></div>`;
}
function bindSetup(){
  const q = s => $root.querySelector(s);
  $root.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>{
    const w = b.dataset.login;
    if(typeof SYNC!=='undefined' && SYNC.on){ SET.who=w; SET.step=3; render(); setTimeout(()=>q('#s-pw')?.focus(),30); return; }
    if(S.setupDone){ S.me=w; save(); render(); toast(`Вы вошли: ${pname(w)}`); }
    else { SET.who=w; SET.step=1; render(); }
  });
  if(SET.step===3){
    const w = SET.who, err = t => { q('#s-err').textContent = t; };
    q('#s-back').onclick=()=>{ SET.step=0; render(); };
    const go = async () => {
      const pw = q('#s-pw').value; if(!pw){ q('#s-pw').focus(); return; }
      if(lockLeftMin()){ err(`Слишком много попыток. Подождите ${lockLeftMin()} мин. или попросите сбросить пароль через ПК`); return; }
      q('#s-go').disabled = true; err('');
      try{
        await syncSignIn(w, pw, q('#s-rem').checked); lockClear();
        if(S.setupDone){ S.me=w; saveLocal(); SET.step=0; render(); toast(`Вы вошли: ${pname(w)}`); syncCycle(); return; }
        await syncCycle();                           // новое устройство: сначала забираем данные из базы
        if(S.setupDone){ S.me=w; SET.step=0; saveLocal(); render(); toast(`Вы вошли: ${pname(w)}`); }
        else { SET.who=w; SET.step=1; render(); }   // база пуста: создаём персонажа
      }catch(e){
        q('#s-go').disabled = false;
        if(e.status===400||e.status===401){
          const left = lockFail();
          err(left ? `Неверный пароль или аккаунт ещё не создан. Осталось попыток: ${left}` : `Неверный пароль. Вход закрыт на ${LOCK_MIN} мин. Если забыли пароль, его можно сбросить через ПК`);
        } else err('Нет связи с сервером, попробуйте ещё раз');
      }
    };
    q('#s-form').onsubmit=e=>{ e.preventDefault(); go(); return false; };
    return;
  }
  if(SET.step!==1) return;
  const w = SET.who;
  q('#s-name')?.addEventListener('input', e=>SET.name[w]=e.target.value);
  bindAvatarEditor(()=>SET.av[w], w, ()=>render());
  q('#s-back').onclick=()=>{ SET.step=0; render(); };
  q('#s-next').onclick=()=>{
    S.people[w]={name:SET.name[w].trim(),avatar:SET.av[w]};
    S.me=w; S.setupDone=true; SET.step=0; save(); render(); toast('Добро пожаловать в 47');
  };
}
function bindAvatarEditor(getA, w, after){
  const all = (sel, fn) => $root.querySelectorAll(sel).forEach(b=>b.onclick=e=>{e.stopPropagation(); fn(b); after();});
  all('[data-preset]', b=>Object.assign(getA(), PRESETS[w][+b.dataset.preset]));
  all('[data-skin]', b=>getA().skin=+b.dataset.skin);
  all('[data-hc]', b=>getA().hc=+b.dataset.hc);
  all('[data-hair]', b=>getA().hair=b.dataset.hair);
  all('[data-acc]', b=>getA().acc=b.dataset.acc);
  all('[data-pc]', b=>{ S.settings.pcolor[effTheme()][w]=+b.dataset.pc; save(); });
}

/* ---------- events ---------- */
function openTask(id, col){
  const src = id ? S.tasks.find(x=>x.id===id) : null;
  const draft = src ? JSON.parse(JSON.stringify(src)) : {id:uid(),title:'',owner:S.me,col:col||S.settings.tasks.defCol,minutes:'',date:'',note:'',sub:[],checks:{'7':false,'4':false},createdAt:Date.now()};
  UI.modal = {type:'task', isNew:!src, draft}; render();
  setTimeout(()=>$root.querySelector('#f-title')?.focus(), 30);
}
function readTaskForm(){
  const d = UI.modal.draft, q = s=>$root.querySelector(s);
  d.title=q('#f-title').value; d.minutes=q('#f-min').value?+q('#f-min').value:''; d.date=q('#f-date').value; d.note=q('#f-note').value;
  $root.querySelectorAll('[data-subt]').forEach(i=>d.sub[+i.dataset.subt].t=i.value);
}
function bind(){
  const q = s=>$root.querySelector(s), all = (s,fn)=>$root.querySelectorAll(s).forEach(fn);
  all('[data-sec]', b=>b.onclick=()=>{UI.section=b.dataset.sec; render(); window.scrollTo(0,0);});
  all('[data-filter]', b=>b.onclick=()=>{UI.filter=b.dataset.filter; render();});
  all('[data-mcol]', b=>b.onclick=()=>{UI.mcol=b.dataset.mcol; render();});
  all('[data-act="add"]', b=>b.onclick=()=>openTask(null, b.dataset.col || (matchMedia('(max-width:820px)').matches && UI.mcol!=='done' ? UI.mcol : S.settings.tasks.defCol)));
  all('[data-act="profile"]', b=>b.onclick=()=>{UI.modal={type:'profile',who:S.me,av:{...S.people[S.me].avatar},name:S.people[S.me].name}; render();});
  all('[data-act="notes"]', b=>b.onclick=()=>{UI.modal={type:'notes'}; S.notes.forEach(n=>{if(n.scope===S.me||n.scope==='shared') n.read=true}); save(); render();});
  all('[data-check]', b=>b.onclick=e=>{ e.stopPropagation();
    const t=S.tasks.find(x=>x.id===b.dataset.check);
    if(t && t.owner==='both' && b.dataset.who===S.me && !t.checks[S.me] && !t.checks[other(S.me)]) askDone(t.id, null); else toggleCheck(b.dataset.check, b.dataset.who); });
  all('[data-open]', el=>el.onclick=()=>openTask(el.dataset.open));
  // drag & drop (desktop)
  all('.card', c=>{
    c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.id); c.classList.add('dragging');};
    c.ondragend=()=>c.classList.remove('dragging');
    c.ondblclick=()=>openTask(c.dataset.id);
  });
  all('.col', col=>{
    col.ondragover=e=>{e.preventDefault(); col.classList.add('drop');};
    col.ondragleave=()=>col.classList.remove('drop');
    col.ondrop=e=>{e.preventDefault(); col.classList.remove('drop'); moveTask(e.dataTransfer.getData('text/plain'), col.dataset.col);};
  });
  // modal common
  all('[data-close]', el=>el.onclick=e=>{ if(e.target===el){ UI.modal=null; render(); } });
  if(UI.section==='food') bindFood();
  if(UI.section==='money') bindMoney();
  bindSettings();
  if(UI.section!=='money' && UI.modal && ['mset','msave'].includes(UI.modal.type)) bindMoney();
  if(!UI.modal) return;
  if(UI.modal.type==='confirm'){
    const go = both => { const m=UI.modal, t=S.tasks.find(x=>x.id===m.id); UI.modal=null;
      if(both && t){ t.checks[other(S.me)]=true; notify(`${pname(S.me)} отметил${fem(S.me)?'а':''} «${t.title}» за вас обоих`, other(S.me)); }
      if(m.col) moveTask(m.id, m.col, true); else toggleCheck(m.id, S.me); };
    q('#cf-yes').onclick=()=>go(true);
    q('#cf-no').onclick=()=>go(false);
    return;
  }
  if(UI.modal.type==='task' && !UI.modal.isNew && !canEdit(UI.modal.draft)){
    all('.sheet input,.sheet textarea,.sheet select,.sheet button:not([data-close])', e=>e.disabled=true);
    return;
  }
  if(UI.modal.type==='task'){
    const d = UI.modal.draft;
    all('#f-owner button', b=>b.onclick=()=>{readTaskForm(); d.owner=b.dataset.v; render();});
    all('#f-col button', b=>b.onclick=()=>{readTaskForm(); d.col=b.dataset.v; render();});
    all('[data-sub]', b=>b.onclick=()=>{readTaskForm(); d.sub[+b.dataset.sub].d=!d.sub[+b.dataset.sub].d; render();});
    all('[data-subdel]', b=>b.onclick=()=>{readTaskForm(); d.sub.splice(+b.dataset.subdel,1); render();});
    q('#f-subadd').onclick=()=>{readTaskForm(); d.sub.push({t:'',d:false}); render(); const ins=$root.querySelectorAll('[data-subt]'); ins[ins.length-1]?.focus();};
    q('#f-title').onkeydown=e=>{ if(e.key==='Enter') q('#f-save').click(); };
    q('#f-save').onclick=()=>{
      readTaskForm(); if(!d.title.trim()){ q('#f-title').focus(); return; }
      d.title=d.title.trim(); d.sub=d.sub.filter(s=>s.t.trim());
      if(d.col==='done' && d.owner!=='both'){ d.checks[d.owner]=true; d.doneAt=d.doneAt||Date.now(); }
      if(d.col==='done' && d.owner==='both' && !(d.checks['7']&&d.checks['4'])){ d.checks[S.me]=true; d.col=d.prevCol&&d.prevCol!=='done'?d.prevCol:'today'; toast('Общая задача уйдёт в «Готово», когда отметитесь оба'); }
      d.by = d.by || S.me; d.editedBy = S.me; d.editedAt = Date.now();
      const i = S.tasks.findIndex(x=>x.id===d.id);
      if(i>=0) S.tasks[i]=d; else { S.tasks.push(d); if(d.owner==='both') notify(`${pname(S.me)} добавил${S.me==='4'?'а':''} общую задачу «${d.title}»`, other(S.me)); }
      UI.modal=null; save(); render(); if(i<0) toast('Задача добавлена');
    };
    q('#f-del') && (q('#f-del').onclick=()=>{ S.tasks=S.tasks.filter(x=>x.id!==d.id); UI.modal=null; save(); render(); toast('Удалено'); });
  }
  if(UI.modal.type==='profile'){
    const m = UI.modal;
    q('#p-name').oninput=e=>m.name=e.target.value;
    bindAvatarEditor(()=>m.av, m.who, ()=>render());
    all('[data-edit]', b=>b.onclick=()=>{ const w=b.dataset.edit; Object.assign(m,{who:w,av:{...S.people[w].avatar},name:S.people[w].name}); render(); });
    all('[data-me]', b=>b.onclick=()=>{ S.me=b.dataset.me; save(); Object.assign(m,{who:S.me,av:{...S.people[S.me].avatar},name:S.people[S.me].name}); render(); });
    q('#p-save').onclick=()=>{ S.people[m.who]={name:m.name.trim(),avatar:{...m.av}}; UI.modal=null; save(); render(); toast('Сохранено'); };
    q('#p-logout').onclick=()=>{ if(typeof syncSignOut==='function') syncSignOut(); S.me=null; UI.modal=null; saveLocal(); render(); };
  }
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && UI.modal){ UI.modal=null; render(); } });
</script>

<script src="food.js"></script>

render();
